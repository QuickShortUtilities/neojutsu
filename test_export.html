          peaks: Array.from({ length: 7 }, () => ({ x: r(), s: .4 + r() * .9 })) };
      },
      draw(g, w, h, t, env, s, o) {
        const sky = g.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#050a24'); sky.addColorStop(1, '#1b3a5c');
        if (o.bg !== false) { g.fillStyle = sky; g.fillRect(0, 0, w, h); }
        s.bands.forEach((b, i) => {
          g.strokeStyle = `rgba(${i % 2 ? 46 : 140},${i % 2 ? 242 : 255},${i % 2 ? 200 : 150},${.28 + env.level * .5})`;
          g.lineWidth = 3 + env.mid * 5;
          g.beginPath();
          for (let x = 0; x <= w; x++) {
            const p = x * .03 + t * (.5 + i * .2) + b.p;
            g.lineTo(x, h * b.y + Math.sin(p) * h * b.a + Math.sin(p * .4) * h * b.a);
          }
          g.stroke();
        });
        const base = h * .74;
        g.fillStyle = '#243a56';
        for (const pk of s.peaks) {
          const x = pk.x * w, ph = h * .2 * pk.s;
          g.beginPath(); g.moveTo(x - ph, base); g.lineTo(x, base - ph); g.lineTo(x + ph, base); g.closePath(); g.fill();
          g.fillStyle = '#dfe9f5';
          g.beginPath(); g.moveTo(x - ph * .35, base - ph * .62); g.lineTo(x, base - ph); g.lineTo(x + ph * .35, base - ph * .62); g.closePath(); g.fill();
          g.fillStyle = '#243a56';
        }
        if (o.bg !== false) { g.fillStyle = '#e8f1fa'; g.fillRect(0, base, w, h - base); }
        for (const f of s.flakes) {
          f.y += f.v * o.speed * o.step * .22;
          f.x += Math.sin(t + f.d * 9) * .0007 * o.speed;
          if (f.y > 1) { f.y = 0; f.x = s.r(); }
          g.fillStyle = `rgba(255,255,255,${.4 + f.v * .5})`;
          g.fillRect((f.x * w) | 0, (f.y * h) | 0, 1, 1);
        }
      },
    },

    volcano: {
      label: 'Volcano · ash', cat: 'biome',
      init(r, w, h, density) {
        const n = Math.round(lerp(14, 60, density));
        return { r, glow: 0,
          embers: Array.from({ length: n }, () => ({ x: r(), y: r(), v: .3 + r(), s: r() })) };
      },
      draw(g, w, h, t, env, s, o) {
        const sky = g.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#1a0508'); sky.addColorStop(.55, '#5c1410'); sky.addColorStop(1, '#0d0406');
        if (o.bg !== false) { g.fillStyle = sky; g.fillRect(0, 0, w, h); }
        const base = h * .8, cx = w * .5, ph = h * .46;
        s.glow += o.step * 2;
        const pulse = .6 + Math.sin(s.glow) * .2 + env.bass * .4;
        g.fillStyle = `rgba(255,110,30,${.16 * pulse})`;
        g.beginPath(); g.arc(cx, base - ph, ph * .9, 0, 7); g.fill();
        g.fillStyle = '#1b1013';
        g.beginPath(); g.moveTo(cx - ph * 1.25, base); g.lineTo(cx - ph * .2, base - ph);
        g.lineTo(cx + ph * .2, base - ph); g.lineTo(cx + ph * 1.25, base); g.closePath(); g.fill();
        g.fillStyle = `rgba(255,${Math.round(90 + pulse * 90)},20,.95)`;
        g.fillRect(cx - ph * .2, base - ph, ph * .4, 3);
        // lava runs
        for (let i = -2; i <= 2; i++) {
          g.strokeStyle = `rgba(255,${Math.round(70 + pulse * 80)},20,.85)`;
          g.lineWidth = Math.max(1, 2 - Math.abs(i) * .4);
          g.beginPath(); g.moveTo(cx + i * 3, base - ph + 2);
          for (let y = base - ph + 2; y < base; y += 5)
            g.lineTo(cx + i * (3 + (y - base + ph) * .28) + Math.sin(y * .3 + i) * 2, y);
          g.stroke();
        }
        if (o.bg !== false) { g.fillStyle = '#0d0406'; g.fillRect(0, base, w, h - base); }
        for (const e of s.embers) {
          e.y -= e.v * o.speed * o.step * .18 * (1 + env.level);
          e.x += Math.sin(t * 1.4 + e.s * 9) * .0012 * o.speed;
          if (e.y < -.05) { e.y = 1.02; e.x = s.r(); }
          g.fillStyle = `rgba(255,${Math.round(120 + e.s * 110)},40,${.35 + e.s * .6})`;
          g.fillRect((e.x * w) | 0, (e.y * h) | 0, 1, e.s > .8 ? 2 : 1);
        }
      },
    },

    ocean: {
      label: 'Ocean · horizon', cat: 'biome',
      init(r, w, h, density) {
        const n = Math.round(lerp(5, 16, density));
        return { r, rows: Array.from({ length: n }, (_, i) => ({ p: r() * 6.28, k: .05 + r() * .06 })) };
      },
      draw(g, w, h, t, env, s, o) {
        const sky = g.createLinearGradient(0, 0, 0, h * .5);
        sky.addColorStop(0, '#20124a'); sky.addColorStop(.6, '#e0576b'); sky.addColorStop(1, '#ffb463');
        g.fillStyle = sky; g.fillRect(0, 0, w, h * .5);
        const hz = h * .5;
        if (o.bg !== false) {
          g.fillStyle = '#ffe9a8';
          g.beginPath(); g.arc(w * .5, hz - 4, 14 + env.bass * 7, 0, 7); g.fill();
        }
        const sea = g.createLinearGradient(0, hz, 0, h);
        sea.addColorStop(0, '#1b3f77'); sea.addColorStop(1, '#071a38');
        if (o.bg !== false) { g.fillStyle = sea; g.fillRect(0, hz, w, h - hz); }
        s.rows.forEach((row, i) => {
          const f = (i + 1) / s.rows.length;
          const y = hz + f * f * (h - hz);
          const amp = 1 + f * 4 * (1 + env.level);
          g.fillStyle = `rgba(255,220,150,${.5 - f * .3})`;
          for (let x = 0; x < w; x += 3) {
            const dy = Math.sin(x * row.k + t * (1 + f * 2) + row.p) * amp;
            const near = Math.abs(x - w / 2) < w * (.06 + f * .22);
            if (near || (x + i) % 9 === 0) g.fillRect(x, y + dy, 2 + f * 3, Math.max(1, f * 2));
          }
        });
      },
    },

    highway: {
      label: 'Highway · night drive', cat: 'racing',
      init(r, w, h, density) {
        const n = Math.round(lerp(6, 22, density));
        return { r, z: 0,
          lights: Array.from({ length: n }, () => ({ d: r(), side: r() > .5, c: r() })),
          city: Array.from({ length: 26 }, () => ({ w: 4 + r() * 12, h: .05 + r() * .16, lit: r() })) };
      },
      draw(g, w, h, t, env, s, o) {
        const sky = g.createLinearGradient(0, 0, 0, h * .52);
        sky.addColorStop(0, '#08061c'); sky.addColorStop(1, '#3b1050');
        const hz = h * .52;
        if (o.bg !== false) g.fillStyle = sky, g.fillRect(0, 0, w, hz);
        let cx0 = 0;
        for (const b of (o.bg !== false ? s.city : [])) {
          const bh = b.h * h;
          g.fillStyle = '#120a20'; g.fillRect(cx0, hz - bh, b.w, bh);
          if (b.lit > .5) {
            g.fillStyle = 'rgba(255,210,63,.75)';
            for (let wy = hz - bh + 2; wy < hz - 2; wy += 4) g.fillRect(cx0 + 1, wy, 1, 2);
          }
          cx0 += b.w + 2;
          if (cx0 > w) break;
        }
        if (o.bg !== false) { g.fillStyle = '#0a0812'; g.fillRect(0, hz, w, h - hz); }
        s.z += o.speed * o.step * (1.4 + env.level * 2);
        for (let y = hz; y < h; y++) {
          const f = (y - hz) / (h - hz);
          const wid = w * (.05 + f * .8), cx = w / 2;
          g.fillStyle = '#1a1a20'; g.fillRect(cx - wid / 2, y, wid, 1);
          if (((f * 8 + s.z) % 1) < .45) { g.fillStyle = '#e8e4d8'; g.fillRect(cx - Math.max(1, wid * .012), y, Math.max(1, wid * .025), 1); }
        }
        for (const L of s.lights) {
          const f = ((L.d + s.z * .25) % 1) ** 2;
          const y = hz + f * (h - hz), wid = w * (.05 + f * .8);
          const x = w / 2 + (L.side ? 1 : -1) * (wid / 2 + 4 + f * 10);
          const r = Math.max(1, f * 3);
          g.fillStyle = L.c > .5 ? 'rgba(255,210,63,.9)' : 'rgba(255,60,60,.9)';
          g.fillRect(x - r / 2, y - 8 - f * 14, r, r);
          g.fillStyle = L.c > .5 ? 'rgba(255,210,63,.18)' : 'rgba(255,60,60,.18)';
          g.fillRect(x - r * 2, y - 9 - f * 14, r * 4, r * 3);
        }
      },
    },

    oasis: {
      label: 'Oasis · palms', cat: 'biome',
      init(r, w, h, density) {
        const n = Math.round(lerp(2, 7, density));
        return { r, off: 0, palms: Array.from({ length: n }, () => ({ x: r() * 1.4, s: .6 + r() * .8, lean: (r() - .5) * .5, d: .4 + r() * .6 })) };
      },
      draw(g, w, h, t, env, s, o) {
        const sky = g.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#1e3d8f'); sky.addColorStop(.5, '#7fc4e8'); sky.addColorStop(.72, '#ffe0a8');
        if (o.bg !== false) { g.fillStyle = sky; g.fillRect(0, 0, w, h); }
        g.fillStyle = '#fff8d0';
        g.beginPath(); g.arc(w * .72, h * .22, 11 + env.bass * 6, 0, 7); g.fill();
        const base = h * .74;
        if (o.bg !== false) {
          g.fillStyle = '#d9b978'; g.fillRect(0, base, w, h - base);
          // water, with a shimmering reflection band
          g.fillStyle = '#2a7fa8'; g.fillRect(0, h * .84, w, h * .16);
        }
        for (let i = 0; o.bg !== false && i < 7; i++) {
          const y = h * .85 + i * (h * .022);
          g.fillStyle = `rgba(190,235,255,${.5 - i * .05})`;
          for (let x = 0; x < w; x += 4)
            if ((x + i * 3 + Math.floor(Math.sin(x * .08 + t * 1.6 + i) * 3)) % 8 < 3) g.fillRect(x, y, 3, 1);
        }
        s.off += o.speed * o.step * 4;
        for (const pm of s.palms) {
          const x = (((pm.x * w - s.off * pm.d) % (w * 1.4)) + w * 1.4) % (w * 1.4);
          if (x > w + 24) continue;
          const th = h * .3 * pm.s, sway = Math.sin(t * 1.1 + pm.x * 8) * .1 + pm.lean;
          g.strokeStyle = '#6b4a26'; g.lineWidth = Math.max(1, 2 * pm.s);
          g.beginPath(); g.moveTo(x, base);
          for (let k = 0; k <= 8; k++) {
            const f = k / 8;
            g.lineTo(x + Math.sin(f * 1.2) * th * sway, base - f * th);
          }
          g.stroke();
          const tx = x + Math.sin(1.2) * th * sway, ty = base - th;
          g.fillStyle = '#2f7a3a';
          for (let k = 0; k < 6; k++) {
            const a = -Math.PI / 2 + (k - 2.5) * .52 + sway * .5;
            g.save(); g.translate(tx, ty); g.rotate(a);
            g.beginPath(); g.ellipse(0, -7 * pm.s, 2.5 * pm.s, 9 * pm.s, 0, 0, 7); g.fill();
            g.restore();
          }
        }
      },
    },
  };

  window.NeoScene = { SCENES, CATS, CHARS, drawChar, rng, randomSeed };
})();

  let loaded = false;
  let ink = null;                       // per-cell ink bounds, measured on load
  const tints = new Map();              // colour -> tinted copy of the sheet
  const TINT_MAX = 24;
  const waiters = [];
  const img = new Image();

  img.onload = () => {
    try { measure(); loaded = true; } catch { loaded = false; }
    while (waiters.length) { const f = waiters.pop(); try { f(); } catch {} }

  // Where the ink actually sits inside each 16px cell. Drawing from these
  // bounds instead of the cell is what keeps a coin coin-sized and a dragon
  // dragon-sized without a hand-written size table.
  function measure() {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(img, 0, 0);
    const data = x.getImageData(0, 0, c.width, c.height).data;
    ink = new Int16Array(COUNT * 4);
    for (let i = 0; i < COUNT; i++) {
      const cx = (i % COLS) * TS, cy = ((i / COLS) | 0) * TS;
      let x0 = TS, y0 = TS, x1 = -1, y1 = -1;
      for (let py = 0; py < TS; py++) {
        for (let px = 0; px < TS; px++) {
          if (data[((cy + py) * c.width + cx + px) * 4 + 3] > 8) {
            if (px < x0) x0 = px; if (px > x1) x1 = px;
            if (py < y0) y0 = py; if (py > y1) y1 = py;
          }
        }
      }
      const o = i * 4;
      if (x1 < 0) { ink[o] = 0; ink[o + 1] = 0; ink[o + 2] = 0; ink[o + 3] = 0; }
      else { ink[o] = x0; ink[o + 1] = y0; ink[o + 2] = x1 - x0 + 1; ink[o + 3] = y1 - y0 + 1; }
    }

  function tinted(colour) {
    let c = tints.get(colour);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const x = c.getContext('2d');
    x.drawImage(img, 0, 0);
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = colour;
    x.fillRect(0, 0, c.width, c.height);
    if (tints.size >= TINT_MAX) tints.delete(tints.keys().next().value);

  function box(idx) {
    if (!loaded || !ink) return null;
    const i = (idx | 0) % COUNT, o = i * 4;
    return ink[o + 2] ? { x: ink[o], y: ink[o + 1], w: ink[o + 2], h: ink[o + 3] } : null;

  /* `turn` is in quarter turns, clockwise. Only quarters: a right angle maps
     every source pixel onto exactly one destination pixel, so the art stays as
     sharp as it was drawn. Anything else would resample and blur it. */
  function blit(ctx, sheet, b, idx, dx, dy, flip, turn) {
    const i = (idx | 0) % COUNT;
    const sx = (i % COLS) * TS + b.x, sy = ((i / COLS) | 0) * TS + b.y;
    const q = ((turn | 0) % 4 + 4) % 4;
    if (!flip && !q) { ctx.drawImage(sheet, sx, sy, b.w, b.h, dx, dy, b.w, b.h); return; }
    ctx.save();
    // Turn about the middle of the sprite, so it does not walk off its own feet.
    ctx.translate(dx + b.w / 2, dy + b.h / 2);
    if (q) ctx.rotate(q * Math.PI / 2);
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(sheet, sx, sy, b.w, b.h, -b.w / 2, -b.h / 2, b.w, b.h);
    ctx.restore();
  }

  /* Draw a sprite standing on (cx, by): centred horizontally, feet on the
     baseline. Entities in the engine are boxes 6-16px wide; the art is
     usually a little larger, which reads as a generous hitbox rather than a
     cheap one. `outline` paints a dark halo first - this project keeps
     losing silhouettes to dark-on-dark palettes, and one pixel of contrast
     is what stops that happening again. */
  function draw(ctx, idx, cx, by, opt) {
    if (!loaded) return false;
    const b = box(idx);
    if (!b) return false;
    const o = opt || {};
    const dx = Math.round(cx - b.w / 2), dy = Math.round(by - b.h);
    if (o.outline) {
      const halo = tinted(o.outline === true ? '#0a0714' : o.outline);
      blit(ctx, halo, b, idx, dx - 1, dy, o.flip, o.turn);
      blit(ctx, halo, b, idx, dx + 1, dy, o.flip, o.turn);
      blit(ctx, halo, b, idx, dx, dy - 1, o.flip, o.turn);
      blit(ctx, halo, b, idx, dx, dy + 1, o.flip, o.turn);
    }
    blit(ctx, tinted(o.colour || '#f9fafb'), b, idx, dx, dy, o.flip, o.turn);
    return true;
  }

  // Draw fitted inside a box, for pickers and menus where a uniform cell
  // matters more than true pixel scale.
  function drawFit(ctx, idx, x, y, w, h, colour) {
    if (!loaded) return false;
    const b = box(idx);
    if (!b) return false;
    const s = Math.max(1, Math.floor(Math.min(w / b.w, h / b.h)));
    const i = (idx | 0) % COUNT;
    const sx = (i % COLS) * TS + b.x, sy = ((i / COLS) | 0) * TS + b.y;
    ctx.drawImage(tinted(colour || '#f9fafb'), sx, sy, b.w, b.h,
                  Math.round(x + (w - b.w * s) / 2), Math.round(y + (h - b.h * s) / 2),
                  b.w * s, b.h * s);
    return true;
  }

  function pick(list, n) {
    if (!list || !list.length) return null;
    return list[Math.abs(n | 0) % list.length];

  // A category may only ask for a body that walks. A shooter played as a
  // platformer is a person with a gun, not a rocket standing on a ledge.
  const PLAYER_BY_CAT = { scifi: 324, strategy: 1022 };
  function playerFor(mode, cat) {
    const byMode = PLAYER_BY_MODE[mode];
    if (byMode !== undefined) return byMode;
    const byCat = PLAYER_BY_CAT[cat];
    return byCat === undefined ? null : byCat;
  }

  // Sprites that are vehicles rather than bodies. A car does not turn around
  // to drive left, it steers.
  const VEHICLES = new Set([989, 990, 991, 992, 1036, 1037, 1038, 1039, 1040, 1041, 736, 942, 943]);

  /* Which way a sprite is drawn. A vehicle seen head-on points up the screen;
     one drawn in profile points right. Getting this wrong is very visible - a
     tank driving north while lying on its side - so the knowledge lives here
     with the art rather than being guessed at by whoever is drawing it. */
  const FACES_UP = new Set([989, 990, 991, 995, 1037, 1038, 1041, 1042]);

  // Quarter turns clockwise to aim sprite `idx` along (ax, ay).
  function turnFor(idx, ax, ay) {
    if (!ax && !ay) return 0;                                 // standing still: leave it as drawn
    const want = ay > 0 ? 2 : ay < 0 ? 0 : ax < 0 ? 3 : 1;    // 0 up, 1 right, 2 down, 3 left
    return (want - (FACES_UP.has(idx) ? 0 : 1) + 4) % 4;      // profile art already points right
  }

  // A top-down vehicle has to be one drawn head-on, or turning it looks wrong.
  const TOPDOWN_VEHICLES = [989, 990, 991, 1038];

  function castFor(cat) { return CAST[cat] || BASE; }

  // Sprite for one entity, chosen from its category cast and pinned by the
  // entity's own id so it does not flicker between frames or reloads.
  function forEntity(type, cat, n) {
    if (Object.prototype.hasOwnProperty.call(ITEM, type)) return ITEM[type];
    return pick(castFor(cat)[type], n);
  }

  window.NeoSprites = {
    TS, COLS, ROWS, COUNT,
    ready(fn) { if (loaded) fn(); else waiters.push(fn); },
    get loaded() { return loaded; },
    box, draw, drawFit, pick, castFor, forEntity, group, playerFor,
    PLAYER_BY_MODE, PLAYER_BY_CAT, VEHICLES, TOPDOWN_VEHICLES, turnFor,
    CAST, ITEM, BASE, BANDS, HANDY,
  };
})();

/* game-sfx.js */
/* Chip sound effects.
 *
 * The same four voices the Audio Studio imitates - pulse, triangle, noise -
 * driven by short envelopes. Sounds are generated, never loaded, so they cost
 * nothing to ship and travel inside a packaged game like everything else.
 */
(() => {
  'use strict';

  // Each effect is a tiny score: waveform, pitch path, length and level.
  const SFX = {
    jump:       { type: 'square', duty: .5,  from: 330, to: 620, time: .12, gain: .16, slide: 'up' },
    doubleJump: { type: 'square', duty: .25, from: 440, to: 780, time: .11, gain: .14, slide: 'up' },
    coin:       { type: 'square', duty: .5,  from: 988, to: 1319, time: .09, gain: .13, step: true },
    gem:        { type: 'square', duty: .25, from: 784, to: 1568, time: .16, gain: .14, step: true },
    key:        { type: 'triangle', from: 523, to: 1046, time: .2, gain: .2, step: true },
    hurt:       { type: 'square', duty: .5,  from: 320, to: 90, time: .28, gain: .18, slide: 'down' },
    kill:       { type: 'noise',  from: 1, to: 0, time: .16, gain: .22 },
    shoot:      { type: 'square', duty: .125, from: 720, to: 240, time: .07, gain: .10, slide: 'down' },
    spring:     { type: 'triangle', from: 220, to: 880, time: .18, gain: .2, slide: 'up' },
    checkpoint: { type: 'triangle', from: 660, to: 990, time: .22, gain: .18, step: true },
    win:        { type: 'square', duty: .5, chord: [523, 659, 784, 1046], time: .5, gain: .16 },
    lose:       { type: 'square', duty: .5, chord: [392, 330, 262, 196], time: .6, gain: .16 },
    land:       { type: 'noise', from: 1, to: 0, time: .05, gain: .08 },
    break:      { type: 'noise', from: 1, to: 0, time: .12, gain: .16 },
    // A speech blip: short and quiet, because a story can be chatty.
    talk:       { type: 'square', duty: .25, from: 440, to: 560, time: .05, gain: .06, step: true },
  };

  let ctx = null, master = null, noiseBuf = null, muted = false;

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = .7; master.connect(ctx.destination);
      // one second of fixed noise, seeded so a game sounds the same everywhere
      const len = ctx.sampleRate;
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      let a = 0x2545f491;
      for (let i = 0; i < len; i++) {
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        d[i] = (((t ^ (t >>> 14)) >>> 0) / 4294967296) * 2 - 1;
      }
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function play(name, volume = 1) {
    if (muted) return;
    const s = SFX[name];
    if (!s || !ensure()) return;
    const now = ctx.currentTime, g = ctx.createGain();
    g.gain.setValueAtTime(s.gain * volume, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + s.time);
    g.connect(master);

    if (s.type === 'noise') {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf; src.loop = true;
      const filt = ctx.createBiquadFilter();
      filt.type = 'bandpass'; filt.frequency.setValueAtTime(1800, now);
      filt.frequency.exponentialRampToValueAtTime(300, now + s.time);
      src.connect(filt).connect(g); src.start(now); src.stop(now + s.time);
      return;
    }
    if (s.chord) {
      // an arpeggio rather than a chord, which is what a chip would do
      const step = s.time / s.chord.length;
      s.chord.forEach((f, i) => {
        const o = ctx.createOscillator(), og = ctx.createGain();
        o.type = 'square'; o.frequency.setValueAtTime(f, now + i * step);
        og.gain.setValueAtTime(0, now);
        og.gain.setValueAtTime(s.gain * volume, now + i * step);
        og.gain.exponentialRampToValueAtTime(0.0001, now + i * step + step * .95);
        o.connect(og).connect(master);
        o.start(now + i * step); o.stop(now + i * step + step);
      });
      return;
    }
    const o = ctx.createOscillator();
    o.type = s.type === 'triangle' ? 'triangle' : 'square';
    o.frequency.setValueAtTime(s.from, now);
    if (s.step) {
      // stepped pitch reads as chip; a smooth glide reads as a modern synth
      o.frequency.setValueAtTime(s.from, now);
      o.frequency.setValueAtTime(s.to, now + s.time * .45);
    } else {
      o.frequency.exponentialRampToValueAtTime(Math.max(20, s.to), now + s.time);
    }
    o.connect(g); o.start(now); o.stop(now + s.time + .02);
  }

  window.NeoSfx = {
    play, ensure,
    get muted() { return muted; },
    set muted(v) { muted = !!v; },
    setVolume(v) { if (ensure()) master.gain.value = Math.max(0, Math.min(1, v)); },
    names: Object.keys(SFX),
  };
})();

/* game-script.js */
/* NeoScript: a tiny language for game rules.
 *
 * Deliberately not JavaScript. There is no eval, no Function constructor, no
 * access to the page, the network, storage or the engine's internals - a script
 * can only read a fixed set of numbers and call a fixed set of actions. That is
 * what makes it safe to run a stranger's game: the worst a hostile script can
 * do is make a bad game.
 *
 * Every run is also bounded. Loops and total steps are capped, so a script
 * cannot hang the tab, and errors are reported rather than thrown.
 */
(() => {
  'use strict';

  const MAX_STEPS = 4000;      // per event, across all loops
  const MAX_DEPTH = 24;
  const EVENTS = ['start', 'tick', 'collect', 'hurt', 'kill', 'land', 'win', 'lose'];

  // Read-only facts a script may consult.
  const READS = ['score', 'keys', 'lives', 'time', 'x', 'y', 'vx', 'vy',
                 'enemies', 'coins', 'deaths', 'grounded', 'facing', 'random'];

  /* Questions about a named thing, for use inside an expression. `x` is
     where you are; `x("guard")` is where the guard is - the same word aimed
     at something else, the way `speed` works. Without these a script could
     command an actor but never ask about one, so no condition could depend
     on where anything had got to. */
  const FUNCS = { x: 1, y: 1, dir: 1, at: 3, near: 2 };

  // Actions a script may take, with how many arguments each expects.
  // A number is an exact arity; a pair is a range, for commands that read
  // better with an optional extra - `talk "hello"` and `talk "guard" "halt"`.
  const ACTIONS = {
    message: 1, win: 0, lose: 0, open: 0, give: 1, hurt: 0, heal: 1,
    spawn: 3, tile: 3, warp: 2, push: 2, gravity: 1, speed: [1, 2], shake: 1, print: 1,
    talk: [1, 2],
    /* Sequencing. Without a wait a script has no time in it, so nothing can
       happen after something else - no cutscene, no boss pattern, no door
       that opens a beat after the switch. */
    wait: 1,
    /* Actors. In a real game most of the script is aimed at a named thing in
       the level: move it, stop it, hide it, arm it. Every entity can carry a
       tag, and these address it. */
    move: 3, nudge: 3, place: 3, stop: 1, hide: 1, show: 1, face: 2,
    setsprite: 2, remove: 1, emote: [1, 2], sound: 1, camera: [1, 2],
    /* A door: `goto 2` or `goto "the cave"`. Leaving for a named room is
       what turns a run of corridors into a place you can come back to. */
    goto: 1,
    shoot: [1, 2],

  };

  // ---------- tokeniser ----------
  function lex(src) {
    const out = [];
    /* The skip is whitespace that is not a newline. With a plain \s* the
       prefix ate every line break before the group could match one, so the
       `\n` alternative never fired and skipNL() had nothing to skip - the
       language looked line-based but was not. A statement that may take an
       optional extra value needs the line ending to know where to stop. */
    const re = /[^\S\n]*("(?:[^"\\]|\\.)*"|>=|<=|==|!=|[-+*/%(),<>]|\n|[A-Za-z_][A-Za-z_0-9]*|\d+(?:\.\d+)?|#[^\n]*)/g;
    let m;
    while ((m = re.exec(src)) !== null) {
      const t = m[1];
      if (t.startsWith('#')) continue;                       // comment
      // Where the token itself starts, not where its leading whitespace does.
      // m.index points at the skipped spaces, so anything reasoning about
      // whether two tokens touch was measuring the gap it meant to detect.
      out.push({ v: t, i: m.index + (m[0].length - t.length) });
      if (re.lastIndex === m.index) re.lastIndex++;
    }
    return out;
  }

  // ---------- parser ----------
  // Statements are one per line; blocks close with `end`. Small enough to hold
  // in your head, which is the point.
  function parse(src) {
    const toks = lex(src);
    const errors = [];
    let p = 0, everyId = 0;
    const peek = () => (toks[p] ? toks[p].v : null);
    const at = i => toks[i] || null;
    const next = () => (toks[p] ? toks[p++].v : null);
    const skipNL = () => { while (peek() === '\n') p++; };
    const expect = v => { if (peek() === v) { p++; return true; } errors.push(`expected "${v}"`); return false; };

    function primary() {
      const t = next();
      if (t === null) { errors.push('unexpected end'); return { k: 'num', v: 0 }; }
      if (t === '(') { const e = expr(); expect(')'); return e; }
      if (t === '-') return { k: 'neg', a: primary() };
      if (t === 'not') return { k: 'not', a: primary() };
      if (/^"/.test(t)) return { k: 'str', v: t.slice(1, -1).replace(/\\(.)/g, '$1') };
      if (/^\d/.test(t)) return { k: 'num', v: parseFloat(t) };
      if (/^[A-Za-z_]/.test(t)) {
        /* A call is a name with the bracket up against it. The gap matters:
           `push n (m)` is two arguments and `at("guard", 3, 4)` is one call,
           and the only thing telling them apart is the space - which is how
           anyone writing it would tell them apart too. */
        const open = at(p);
        if (open && open.v === '(' && open.i === at(p - 1).i + t.length) {
          p++;                                                   // the bracket
          const args = [];
          if (peek() !== ')') {
            for (;;) {
              args.push(expr());
              if (peek() !== ',') break;
              next();
            }
          }
          expect(')');
          const want = FUNCS[t];
          if (want === undefined) errors.push(`no such question as "${t}"`);
          else if (args.length !== want) {
            errors.push(`"${t}" takes ${want} value${want === 1 ? '' : 's'}, given ${args.length}`);
          }
          // `ask`, not `call`: a statement is already a call, and the two
          // live in different switches. One name for two things is how you
          // get a bug that only shows up in the one you were not thinking of.
          return { k: 'ask', name: t, args };
        }
        return { k: 'var', v: t };
      }
      errors.push(`unexpected "${t}"`);
      return { k: 'num', v: 0 };
    }
    const LEVELS = [['or'], ['and'], ['==', '!=', '<', '>', '<=', '>='], ['+', '-'], ['*', '/', '%']];
    /* `face "guard" -1` is two arguments, not one subtraction.

       A minus that has a space before it and none after belongs to the number
       that follows, the way it does when anyone writes it. Without this rule
       every command taking a negative second value silently became one
       argument and failed to compile - found by translating real scripts,
       which is exactly the sort of thing writing our own examples would not
       have turned up. `a - 1` and `a-1` are still subtraction. */
    function tightMinus() {
      const tok = at(p), rhs = at(p + 1), lhs = at(p - 1);
      if (!tok || tok.v !== '-' || !rhs) return false;
      const gapBefore = !lhs || tok.i > lhs.i + String(lhs.v).length;
      const gapAfter = rhs.i > tok.i + 1;
      return gapBefore && !gapAfter;
    }

    function binary(level) {
      if (level >= LEVELS.length) return primary();
      let left = binary(level + 1);
      while (LEVELS[level].includes(peek())) {
        if (peek() === '-' && tightMinus()) break;
        const op = next();
        left = { k: 'bin', op, a: left, b: binary(level + 1) };
      }
      return left;
    }
    const expr = () => binary(0);

    function block(stop) {
      const body = [];
      for (;;) {
        skipNL();
        const t = peek();
        if (t === null) break;
        if (stop.includes(t)) break;
        body.push(statement());
      }
      return body;
    }

    function statement() {
      const t = next();
      if (t === 'set') {
        const name = next();
        if (!/^[A-Za-z_]/.test(name || '')) errors.push('set needs a name');
        return { k: 'set', name, value: expr() };
      }
      if (t === 'if') {
        const cond = expr();
        const then = block(['else', 'end']);
        let other = [];
        if (peek() === 'else') { next(); other = block(['end']); }
        expect('end');
        return { k: 'if', cond, then, other };
      }
      if (t === 'while') {
        const cond = expr();
        const body = block(['end']);
        expect('end');
        return { k: 'while', cond, body };
      }
      if (t === 'every') {                     // every N seconds ... end
        const secs = expr();
        const body = block(['end']);
        expect('end');
        // The timer lives in the script's variables, not on this node, so
        // restarting the game restarts the clock too.
        return { k: 'every', secs, body, id: everyId++ };
      }
      if (t === 'do') {
        const name = peek();
        if (!name || !/^[A-Za-z_]/.test(name)) { errors.push('do needs the name of a routine'); return { k: 'noop' }; }
        next();
        return { k: 'do', name };
      }
      if (Object.prototype.hasOwnProperty.call(ACTIONS, t)) {
        const args = [];
        const want = ACTIONS[t];
        const lo = Array.isArray(want) ? want[0] : want;
        const hi = Array.isArray(want) ? want[1] : want;
        for (let i = 0; i < hi; i++) { if (peek() === '\n' || peek() === null) break; args.push(expr()); }
        if (args.length < lo || args.length > hi) {
          errors.push(lo === hi
            ? `${t} takes ${hi} value${hi === 1 ? '' : 's'}`
            : `${t} takes ${lo} or ${hi} values`);
        }
        return { k: 'call', name: t, args };
      }
      errors.push(`unknown command "${t}"`);
      while (peek() !== '\n' && peek() !== null) next();
      return { k: 'noop' };
    }

    const events = {}, routines = {};
    for (;;) {
      skipNL();
      if (peek() === null) break;
      // A routine is a piece of the game you can name and use more than once,
      // which is how a game gets built out of parts instead of one long list.
      if (peek() === 'define') {
        next();
        const name = next();
        if (!name || !/^[A-Za-z_]/.test(name)) errors.push('define needs a name');
        const body = block(['end']);
        expect('end');
        if (name) routines[name] = body;
        continue;
      }
      if (peek() !== 'on') { errors.push(`expected "on" or "define", found "${peek()}"`); next(); continue; }
      next();
      const name = next();
      if (!EVENTS.includes(name)) errors.push(`unknown event "${name}"`);
      const body = block(['end']);
      expect('end');
      (events[name] = events[name] || []).push(...body);
    }
    // A routine that is used but never written is a typo, and finding it at
    // compile time is better than finding it when the boss does not appear.
    const seen = new Set();
    (function scan(list) {
      for (const st of list || []) {
        if (!st) continue;
        if (st.k === 'do') { seen.add(st.name); if (!routines[st.name]) errors.push(`no routine called "${st.name}"`); }
        scan(st.then); scan(st.other); scan(st.body);
      }
    })([].concat(...Object.values(events), ...Object.values(routines)));
    return { events, routines, errors };
  }

  // ---------- interpreter ----------
  /* Running a script is no longer "do all of it now".

     A game needs time in it: open the gate, wait, then let the water in. So a
     firing becomes a thread that the engine steps, and `wait` suspends it
     until the clock catches up. Everything else - conditions, loops, routines
     - is the same language it was, but it can now be spread across seconds
     instead of happening in one indivisible instant. */
  function makeThread(program, event, env) {
    const body = program && program.events && program.events[event];
    if (!body || !body.length) return null;
    const routines = (program && program.routines) || {};
    const vars = env.vars;
    let steps = 0;

    const read = name => {
      if (name === 'random') return env.random();
      if (READS.includes(name)) return env.read(name);
      if (name === 'true') return 1;
      if (name === 'false') return 0;
      return Object.prototype.hasOwnProperty.call(vars, name) ? vars[name] : 0;
    };

    function ev(node, depth) {
      if (++steps > MAX_STEPS) throw new RangeError('script ran too long');
      if (depth > MAX_DEPTH) throw new RangeError('script nested too deeply');
      switch (node.k) {
        case 'num': case 'str': return node.v;
        case 'var': return read(node.v);
        case 'ask': {
          // A question about a named thing. The engine answers; an engine that
          // does not know the word answers nothing, which reads as zero.
          const vals = node.args.map(a => ev(a, depth + 1));
          return env.ask ? (env.ask(node.name, vals) || 0) : 0;
        }
        case 'neg': return -ev(node.a, depth + 1);
        case 'not': return ev(node.a, depth + 1) ? 0 : 1;
        case 'bin': {
          const a = ev(node.a, depth + 1);
          if (node.op === 'and') return a ? (ev(node.b, depth + 1) ? 1 : 0) : 0;
          if (node.op === 'or') return a ? 1 : (ev(node.b, depth + 1) ? 1 : 0);
          const b = ev(node.b, depth + 1);
          switch (node.op) {
            case '+': return (typeof a === 'string' || typeof b === 'string') ? String(a) + String(b) : a + b;
            case '-': return a - b; case '*': return a * b;
            case '/': return b === 0 ? 0 : a / b;
            case '%': return b === 0 ? 0 : a % b;
            case '==': return a === b ? 1 : 0; case '!=': return a !== b ? 1 : 0;
            case '<': return a < b ? 1 : 0;  case '>': return a > b ? 1 : 0;
            case '<=': return a <= b ? 1 : 0; case '>=': return a >= b ? 1 : 0;
          }
          return 0;
        }
      }
      return 0;
    }

    function* exec(list, depth) {
      for (const st of list) {
        if (++steps > MAX_STEPS) throw new RangeError('script ran too long');
        switch (st.k) {
          case 'set': vars[st.name] = ev(st.value, depth); break;
          case 'if':
            if (ev(st.cond, depth)) yield* exec(st.then, depth + 1);
            else yield* exec(st.other, depth + 1);
            break;
          case 'while': {
            let guard = 0;
            while (ev(st.cond, depth)) {
              yield* exec(st.body, depth + 1);
              if (++guard > 500) throw new RangeError('loop ran too long');
            }
            break;
          }
          case 'every': {
            // Waits a full interval before the first run. Firing at zero made
            // "every 3 seconds, flood a row" flood one before anyone had moved.
            const now = env.read('time'), gap = ev(st.secs, depth) || 1;
            const key = '__every' + st.id;
            const last = Object.prototype.hasOwnProperty.call(vars, key) ? vars[key] : 0;
            if (now - last >= gap) { vars[key] = now; yield* exec(st.body, depth + 1); }
            break;
          }
          case 'do': {
            if (depth > MAX_DEPTH) throw new RangeError('script nested too deeply');
            yield* exec(routines[st.name] || [], depth + 1);
            break;
          }
          case 'call': {
            const args = st.args.map(a => ev(a, depth));
            if (st.name === 'wait') { yield Math.max(0, Math.min(60, +args[0] || 0)); break; }
            env.act(st.name, args);
            break;
          }
        }
      }
    }

    return { gen: exec(body, 0), wait: 0, done: false, event, fault: '',
             // The step budget is per resume, so a thread that lives for a
             // minute is not starved by what it did a minute ago.
             fresh() { steps = 0; } };
  }

  // One frame of one thread. Returns whether it is still going.
  function resume(thread, dt) {
    if (!thread || thread.done) return false;
    if (thread.wait > 0) {
      thread.wait -= dt;
      if (thread.wait > 0) return true;
    }
    thread.fresh();
    try {
      const r = thread.gen.next();
      if (r.done) { thread.done = true; return false; }
      const secs = +r.value || 0;
      thread.wait = secs > 0 ? secs : 0;
      return true;
    } catch (e) {
      thread.done = true;
      thread.fault = e && e.message ? e.message : String(e);
      return false;
    }
  }

  /* The old contract: run the whole thing now. Kept because per-frame logic
     wants it and because a wait has no meaning in something that must finish
     inside one frame. Waits collapse to nothing here. */
  function run(program, event, env) {
    const t = makeThread(program, event, env);
    if (!t) return;
    for (let i = 0; i < 512; i++) {
      t.fresh();
      let r;
      try { r = t.gen.next(); }
      catch (e) { env.fault(e && e.message ? e.message : String(e)); return; }
      if (r.done) return;
    }
    env.fault('script ran too long');
  }

  const compile = src => {
    const r = parse(String(src || ''));
    return { events: r.events, routines: r.routines, errors: r.errors,
             empty: !Object.keys(r.events).length };
  };

  window.NeoScript = { compile, run, makeThread, resume, EVENTS, READS, ACTIONS, FUNCS, MAX_STEPS };
})();

/* game-engine.js */
/* NeoJutsu game engine.
 *
 * A small, deterministic runtime for games that look and behave like the
 * hardware the rest of the studio imitates: an 8px tile grid, a fixed timestep,
 * seeded randomness, and the same palette snap the Video Studio uses, so a game
 * frame and a video frame come out of the same machine.
 *
 * A game is plain JSON - a tilemap, some entities and a rule - which keeps a
 * whole game a few KB, shareable by link, and editable by hand.
 */
(() => {
  'use strict';

  const TILE = 8;
  const STEP = 1 / 60;                 // physics runs fixed; rendering does not
  const MAX_CATCHUP = 5;               // never simulate more than this in one frame

  // Tile 0 is empty. Everything else is solid unless it says otherwise.
  // Solid ground is kept dark and its lip bright. The palette snap reduces the
  // frame to a handful of tones, so a mid-brown floor under a mid-blue sky
  // collapses into one colour and the level stops reading as a level.
  // Ids are base36 digits in the level string, so 0-9 then a-z.
  const TILES = {
    0:  { name: 'sky',       solid: false },
    1:  { name: 'ground',    solid: true,  fill: '#241a0e', top: '#7bbf4a' },
    2:  { name: 'stone',     solid: true,  fill: '#26262f', top: '#9a9aab' },
    3:  { name: 'ledge',     solid: 'top', fill: '#3a2410', top: '#c08a4a' },
    4:  { name: 'spikes',    solid: false, hazard: true, fill: '#2a0808', top: '#ff5a3c' },
    5:  { name: 'ladder',    solid: false, ladder: true, fill: '#6a4a20' },
    6:  { name: 'water',     solid: false, water: true,  fill: '#0e2a52', top: '#3f8fd0' },
    7:  { name: 'brick',     solid: true,  breakable: true, fill: '#2e1410', top: '#a85a3a' },
    8:  { name: 'ice',       solid: true,  ice: true,    fill: '#1b3550', top: '#9fe8ff' },
    9:  { name: 'belt →',    solid: true,  belt: 60,     fill: '#2a2438', top: '#c060ff' },
    10: { name: 'belt ←',    solid: true,  belt: -60,    fill: '#2a2438', top: '#c060ff' },
    11: { name: 'spring',    solid: true,  spring: 1.7,  fill: '#243018', top: '#3fbf4a' },
    12: { name: 'door',      solid: true,  door: true,   fill: '#3a2a10', top: '#ffd23f' },
    13: { name: 'checkpoint',solid: false, checkpoint: true, fill: '#101a2e', top: '#2ef2ff' },
    14: { name: 'lava',      solid: false, hazard: true, fill: '#3a0c04', top: '#ff8c1a' },
    15: { name: 'crate',     solid: true,  breakable: true, fill: '#3a2a14', top: '#b98a4a' },
    16: { name: 'grass',     solid: false, decor: true, hide: true, fill: '#1c3a18', top: '#3fbf4a' },
    17: { name: 'backwall',  solid: false, fill: '#1a1626' },
    18: { name: 'exit',      solid: false, exit: true,   fill: '#0d2a16', top: '#3fbf4a' },
    19: { name: 'road',      solid: false, road: true,   fill: '#4a4a57' },
    20: { name: 'line',      solid: false, decor: true,  fill: '#4a4a57', top: '#e8e4d8' },

  const rng = seedStr => {
    let h = 1779033703 ^ String(seedStr).length;
    for (let i = 0; i < String(seedStr).length; i++) {
      h = Math.imul(h ^ String(seedStr).charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19);
    }
    let a = h >>> 0;
    return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  };

  // ---------- level ----------
  function makeLevel(spec) {
    const w = spec.w | 0, h = spec.h | 0;
    const tiles = new Uint8Array(w * h);
    if (Array.isArray(spec.tiles)) tiles.set(spec.tiles.slice(0, w * h));
    else if (typeof spec.tiles === 'string') {
      // Rows of digits, which is what makes a level readable in JSON.
      const rows = spec.tiles.trim().split('\n');
      for (let y = 0; y < Math.min(h, rows.length); y++)
        for (let x = 0; x < Math.min(w, rows[y].length); x++)

    return { w, h, tiles, at(x, y) { return (x < 0 || y < 0 || x >= w || y >= h) ? 0 : tiles[y * w + x]; } };
  }

  /* `blocks` is the one shape here with no avatar in it at all. Everything
     else is a body moving through a level; this is a level being built out
     of the thing you are steering, and it stops when there is no room to
     put the next one. It takes the tilemap, the renderer, the palette, the
     HUD, the script layer and the packaging exactly as they are - what it
     supplies is its own idea of what a frame is. */
  /* `rider` is side-on and always moving: a bike over hills, where the
     question is not whether you can reach the ledge but what angle you are
     at when you meet the ground again. Same gravity and same collision as a
     platformer - what it adds is a throttle you cannot let go of and a
     pitch that has to be level when you land. */

  // depends on the state of the game rather than on the tile alone.
  const solidAt = (lvl, tx, ty, ctx) => {
    const t = tileInfo(lvl.at(tx, ty));
    if (t.door) return !(ctx && ctx.doorsOpen);
    return t.solid === true;
  };

  // Every tile the body currently overlaps, which is how ladders, water, belts
  // and checkpoints are detected without a separate trigger volume.
  function tilesUnder(lvl, b) {
    const out = [];
    const x0 = Math.floor(b.x / TILE), x1 = Math.floor((b.x + b.w - 1) / TILE);
    const y0 = Math.floor(b.y / TILE), y1 = Math.floor((b.y + b.h - 1) / TILE);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      const id = lvl.at(tx, ty);
      if (id) out.push({ tx, ty, id, info: tileInfo(id) });

    return out;

  // ---------- entities ----------
  const ENTITY = {
    coin:   { w: 6, h: 6,  collect: true, score: 1 },
    gem:    { w: 7, h: 7,  collect: true, score: 5 },
    heart:  { w: 7, h: 6,  collect: true, heal: 1 },
    key:    { w: 6, h: 7,  collect: true, key: true },
    /* A maze game is not a level with a flag at the end of it. Every dot has
       to go, and the one thing that turns the chase round is a pellet. */
    dot:    { w: 4, h: 4,  collect: true, score: 1 },
    pellet: { w: 7, h: 7,  collect: true, score: 5, scare: 7 },
    goal:   { w: 8, h: 12, goal: true },
    walker: { w: 8, h: 10, enemy: true, speed: 22, turns: true, hp: 1 },
    flyer:  { w: 8, h: 8,  enemy: true, speed: 26, floats: true, hp: 1 },
    chaser: { w: 8, h: 10, enemy: true, speed: 40, chases: true, sight: 90, cone: true, hp: 2 },
    jumper: { w: 9, h: 9,  enemy: true, speed: 14, hops: true, hp: 1 },
    turret: { w: 8, h: 8,  enemy: true, speed: 0, fires: 1.4, hp: 3, still: true },
    // Hunts you and shoots back. A walker that fires is a soldier; a chaser
    // that fires is an enemy tank, and nothing else in the cast is both.
    hunter: { w: 8, h: 10, enemy: true, speed: 26, chases: true, sight: 110, cone: true, fires: 1.7, hp: 2 },
    /* A ghost always knows where you are - that is the genre - so it is slow
       enough to be outrun instead. A chaser at its own speed catches a
       standing player in a second and a half, which makes a maze a coin flip
       rather than a chase. */
    ghost:  { w: 8, h: 10, enemy: true, speed: 30, chases: true, sight: 9999, smells: true, hp: 1 },
    /* Something you fight rather than something you avoid. Touching it does
       not take a life; it takes over the screen, and what happens next is
       turns and a menu rather than jumping and running. */
    rival:  { w: 8, h: 10, enemy: true, speed: 16, chases: true, sight: 64, hp: 1, fight: true },
    /* A formation moves as one thing, not as a crowd of things that happen to
       be next to each other: they step together, turn together at the wall,
       and drop a row when they turn. Taking one out speeds up the rest. */
    invader: { w: 8, h: 8, enemy: true, speed: 0, march: true, fires: 3.4, hp: 1 },
    spike:  { w: 8, h: 4,  enemy: true, speed: 0, still: true, hp: 99 },
    shot:   { w: 3, h: 3,  bullet: true, speed: 110 },
    mover:  { w: 16, h: 4, platform: true, speed: 26, span: 48 },
  };

  let entitySeq = 0;
  function makeEntity(e) {
    const def = ENTITY[e.type] || ENTITY.coin;
    return { id: ++entitySeq, type: e.type, x: e.x, y: e.y, w: def.w, h: def.h, def,
             vx: (def.speed || 0) * (e.dir === -1 ? -1 : 1), vy: 0, hp: def.hp || 1,
             /* Pace belongs to the thing, not to its kind. The def is shared
                by every walker in the level, so changing it changed all of
                them; this is the copy a script is allowed to touch. */
             speed: def.speed || 0, face: e.dir || 1,
             home: { x: e.x, y: e.y }, alive: true, t: (e.x * 7 + e.y * 13) % 628 / 100,
             life: 0, cool: 0, tag: e.tag || '',
             // What a script can change about an actor: where it is going,
             // whether it is on stage, and what it looks like.
             hidden: false, goal: null, sprite: (typeof e.sprite === 'number' ? e.sprite : null),
             /* When this thing starts moving. A maze game lets its hunters out
                one at a time rather than all four at the whistle, and a boss
                that waits for you to be in the room is the same idea. Until
                then it sits where it was put. */
             wake: e.wake || 0,
             to: e.to };
  }

  // ---------- collision ----------
  const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  // Move on one axis at a time and resolve against the grid. Doing the axes
  // separately is what stops a body catching on the seam between two tiles.
  function moveAxis(body, lvl, dx, dy, wasFalling, ctx) {
    const hit = { wall: 0, floor: null, ceil: null };
    if (dx) {
      body.x += dx;
      const y0 = Math.floor(body.y / TILE), y1 = Math.floor((body.y + body.h - 1) / TILE);
      const edge = dx > 0 ? Math.floor((body.x + body.w - 1) / TILE) : Math.floor(body.x / TILE);
      for (let ty = y0; ty <= y1; ty++) {
        if (!solidAt(lvl, edge, ty, ctx)) continue;
        body.x = dx > 0 ? edge * TILE - body.w : (edge + 1) * TILE;
        body.vx = 0; hit.wall = dx > 0 ? 1 : -1; break;
      }
    }
    if (dy) {
      body.y += dy;
      const x0 = Math.floor(body.x / TILE), x1 = Math.floor((body.x + body.w - 1) / TILE);
      const edge = dy > 0 ? Math.floor((body.y + body.h - 1) / TILE) : Math.floor(body.y / TILE);
      for (let tx = x0; tx <= x1; tx++) {
        const solid = solidAt(lvl, tx, edge, ctx);
        // One-way tiles only catch a body that is falling onto them from above.
        const oneWay = dy > 0 && oneWayAt(lvl, tx, edge) &&
                       wasFalling && (body.y + body.h - dy) <= edge * TILE + 1;
        if (!solid && !oneWay) continue;
        if (dy > 0) { body.y = edge * TILE - body.h; body.grounded = true; hit.floor = { tx, ty: edge }; }

  // ---------- the game ----------

       it and they come down to you. It is the one arcade shape this engine
       could not make - every other mode is a body travelling through a level,
       and this is a level travelling towards a body. */

    // Racer and shmup scroll the world past you; you never walk, you steer.
    /* `scramble` steers the same way and travels the other way: a cave that
       comes at you from the right rather than a road that comes down at you.
       Everything about being carried along is shared - only the axis and the
       direction the gun points are not, so those are named rather than
       written twice. */
    const scrolling = mode === 'racer' || mode === 'shmup' || mode === 'scramble';
    const alongX = mode === 'scramble';

    const coop = !!(spec.coop || spec.players === 2);

    let scroll = 0;

       list of them - or the older single `level`, which becomes a run of one
       so nothing that already exists has to change. Score, lives and keys
       carry across; the level, its cast, its scenery and its story do not. */
    const stageList = (Array.isArray(spec.levels) && spec.levels.length
      ? spec.levels.slice(0, 24)

           props: spec.props, story: spec.story, start: spec.start,
           rules: spec.rules, cut: spec.cut }]);
    let stageIndex = 0, stageStory = [], scoreAtStage = 0, pendingStage = -1;
    let cutT = 0, cutLines = [];
    let lvl = makeLevel(stageList[0].level || { w: 20, h: 18, tiles: '' });

       no collision, no rules, no script access. That is deliberate - it means
       a level can be dressed with any of the atlas's 1078 drawings without any
       of them being able to change how the game plays. */
    let props = [];

                              doubleJump: false, wallJump: false, dash: false, attack: false,
                              aimLock: false },

    let player, players, entities, state, score, keys, lives, message, elapsed, won;
    let doorsOpen, respawn, fired, effects, messageAt, shake = 0;

    let scared = 0;

       what is being said about it. Null the rest of the time. */
    let fight = null;

    let beaten = 0;

      { cells: [[0, 0], [0, 1], [1, 1], [2, 1]], size: 3, tile: 1 },   // J
      { cells: [[2, 0], [0, 1], [1, 1], [2, 1]], size: 3, tile: 1 },   // L
      { cells: [[1, 0], [2, 0], [0, 1], [1, 1]], size: 3, tile: 7 },   // S
      { cells: [[0, 0], [1, 0], [1, 1], [2, 1]], size: 3, tile: 7 },   // Z
      { cells: [[1, 0], [0, 1], [1, 1], [2, 1]], size: 3, tile: 15 },  // T

       it because reset() runs before the code further down has been reached,
       and a `let` is not available before its own line. */

    // the well is full - not when the whole board is, which never happens.
    let wellL = 1, wellR = 1;

       character talking, anchored to whoever said it and gone a few seconds
       later. Stories are made of these. */

    // three works the same way as arriving in stage one.

      const auto = (window.NeoSprites && window.NeoSprites.playerFor(mode, spec.cat)) ?? null;

        n, input: inp, tint: n === 2 ? (P.tint2 || '#ff2e88') : (P.tint || '#2ef2ff'),
        char: n === 2 ? (P.char2 || 'ninja') : P.char,
        sprite: (n === 2 ? P.sprite2 : P.sprite) ?? auto,
        x: start.x + dx, y: start.y, w: 6, h: 12, vx: 0, vy: 0, grounded: false,
        face: 1, aimX: 1, aimY: 0, coyote: 0, buffer: 0, walk: 0,
        // Which way the bike is pointing, in radians. Only a rider uses it.
        pitch: 0, crash: 0,
        wall: 0, dash: 0, dashLeft: P.dash ? 1 : 0, doubleLeft: P.doubleJump ? 1 : 0,
        shotCool: 0, shotHeld: false, bWasDown: false, aWasDown: false,
        // A script may command a body the same way it commands an actor.
        hidden: false, goal: null, def: { speed: P.speed },
        // A moment of grace on arriving, so a turret already aimed at
        // the spawn cannot land a hit before anyone has moved.
        hurt: P.grace ?? 1.1,

      // inside one another.

      player = players[0];
    }

    // Everything a stage owns. What the player has earned is not here, which
    // is the whole point of stages: the room changes, the run continues.
    function loadStage(i) {
      stageIndex = Math.max(0, Math.min(stageList.length - 1, i | 0));
      const st = stageList[stageIndex] || {};
      lvl = makeLevel(st.level || { w: 20, h: 18, tiles: '' });
      props = (st.props || []).map(pr => ({
        i: pr.i | 0, x: Math.round(pr.x) || 0, y: Math.round(pr.y) || 0,
        t: typeof pr.t === 'string' ? pr.t.slice(0, 24) : '', b: !!pr.b,
      })).slice(0, 600);
      entities = (st.entities || []).map(makeEntity);
      stageStory = Array.isArray(st.story) ? st.story : [];
      toldBeats = new Set();
      bubbles = []; emotes = []; camHold = null;
      scoreAtStage = score;
      const start = st.start || { x: TILE, y: TILE };
      respawn = { x: start.x, y: start.y };
      spawnBodies(start);
      view.x = 0; view.y = 0;
      scroll = scrollCfg.speed;
      if (scrolling) {
        // The near edge of the axis you travel along: the bottom of a tall
        // level, or the left of a wide one.
        view.y = alongX ? Math.max(0, Math.round((lvl.h * TILE - view.h) / 2))
                        : Math.max(0, lvl.h * TILE - view.h);
        view.x = alongX ? 0 : Math.max(0, Math.min(view.x, lvl.w * TILE - view.w));
      }

      message = ''; messageAt = 0;
      threads = [];
    }

    /* Which room is meant. A number counts from one, a name matches the
       stage's own - both because a script written by a person says "the
       cave" and a script written by a machine says 2. */
    function findStage(which) {
      if (typeof which === 'string') {
        const want = which.trim().toLowerCase();
        const byName = stageList.findIndex(st => String(st.name || '').trim().toLowerCase() === want);
        if (byName >= 0) return byName;
        const asNum = parseInt(want, 10);
        return Number.isFinite(asNum) ? asNum - 1 : -1;
      }
      const i = Math.round(Number(which) || 0) - 1;
      return Number.isFinite(i) ? i : -1;
    }

    // Leave for another room, with the card in between.
    function leaveFor(target, quiet) {
      if (!(target >= 0 && target < stageList.length) || target === stageIndex) return false;
      pendingStage = target;
      cutLines = cutTextFor(stageList[target], target);
      cutT = 0; state = 'cut';
      if (!quiet) say('checkpoint');
      return true;
    }

    function stageRules() {
      const st = stageList[stageIndex] || {};
      return st.rules || spec.rules || {};
    }

    function reset() {
      score = 0; keys = 0; lives = spec.lives ?? 3; elapsed = 0; won = false;
      state = 'play'; cutT = 0; cutLines = [];
      fired = [];
      if (scriptEnv) { scriptEnv.vars = {}; scriptFault = ''; scriptLog = []; }
      loadStage(0);
      piece = null; dropAt = 0; moveAt = 0; lines = 0; bag = [];
      fight = null; beaten = 0;
      if (mode === 'blocks') measureWell();
      if (program) fire('start');
    }
    // The script sees numbers and may call actions. It never sees the engine,
    // the page, or anything it could use to reach either.
    let program = null, scriptLog = [], scriptFault = '';
    /* A firing is a thread now, not an instant. Most of them run to the end
       in the frame they start - a script with no wait in it behaves exactly
       as it always did - but one that waits carries on across seconds. */
    let threads = [];
    const MAX_THREADS = 8;
    function compileScript() {
      scriptLog = []; scriptFault = '';
      if (!spec.script || !window.NeoScript) { program = null; return { errors: [] }; }
      const r = window.NeoScript.compile(spec.script);
      program = r.empty ? null : r;
      return r;
    }
    compileScript();

    const scriptEnv = {
      vars: {},
      random: () => rand(),
      read(name) {
        switch (name) {
          case 'score': return score; case 'keys': return keys; case 'lives': return lives;
          case 'time': return elapsed; case 'x': return player.x / TILE; case 'y': return player.y / TILE;
          case 'vx': return player.vx; case 'vy': return player.vy;
          case 'enemies': return entities.filter(e => e.alive && e.def.enemy).length;
          case 'coins': return entities.filter(e => e.alive && e.def.collect && !e.def.key).length;
          case 'deaths': return (spec.lives ?? 3) - lives;
          case 'grounded': return player.grounded ? 1 : 0;
          case 'facing': return player.face;
        }
        return 0;
      },
      /* The same questions, asked about something other than you. A tag may
         name several things - "guard" could be three of them - and the first
         one is the answer, which is what `move "guard"` already assumes. */
      ask(name, args) {
        const who = tagged(args[0])[0];
        if (!who) return 0;
        switch (name) {
          case 'x': return who.x / TILE;
          case 'y': return who.y / TILE;
          /* Four ways, as one number: right 1, left -1, down 2, up -2.
             Only an overhead body has an aim worth reading; everything else
             faces the way it is travelling. */
          case 'dir':
            if (mode === 'topdown' && (who.aimX || who.aimY)) {
              return who.aimY ? (who.aimY > 0 ? 2 : -2) : who.aimX;
            }
            return who.face || (who.vx > 0 ? 1 : who.vx < 0 ? -1 : 1);
